<!doctype html>
<html lang="pt-BR"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Maria's Diary · Tentando sobreviver.</title> 
  <link rel="icon" type="image/gif" href="spinosistrans.gif"> 
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"> 
  <style> 
  :root { 
    --bg: #FE5165; 
    --ink: #161412; 
    --red: #ffffff; 
    --yellow:#1F340C;  
    --blue: #ffffff;  
    --white: #515A25;  
    --pad: clamp(1rem, 4vw, 2rem); 
    --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif; 
    --mono: 'JetBrains Mono', 'Courier New', monospace; 
  } 
   
  * {  
    box-sizing: border-box;  
    margin: 0;  
    padding: 0;  
  } 
   body {  
    background: var(--bg);  
    color: var(--ink);  
    font-family: var(--sans);  
    line-height: 1.45; 
    overflow-x: hidden; 
    width: 100%; 
    /* Visualização global ajustada a 80% */ 
    zoom: 0.8; 
  } 
   a {  
    color: inherit;  
    text-decoration: none;  
    word-break: break-word; 
  } 
   :focus-visible {  
    outline: 3px solid var(--blue);  
    outline-offset: 2px;  
  } 
   .mono {  
    font-family: var(--mono);  
    font-size: .68rem;  
    letter-spacing: .06em;  
    text-transform: uppercase;  
  } 
   /* Topo */ 
  .topbar {  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
    flex-wrap: wrap;  
    gap: 1rem; 
    padding: 1rem var(--pad);  
    border-bottom: 3px solid var(--ink);  
  } 
   .brand {  
    display: flex;  
    align-items: center;  
    gap: .5rem;  
    font-weight: 800;  
    font-size: 1.05rem;  
    letter-spacing: -.01em;  
  } 
   .title-icon { 
    width: 28px; 
    height: auto; 
    display: block; 
    object-fit: contain; 
  } 
   .filter-tags {  
    display: flex;  
    gap: .5rem;  
    flex-wrap: wrap;  
  } 
   .filter-btn {  
    background: var(--bg);  
    border: 2px solid var(--ink);  
    padding: .45rem .8rem;  
    cursor: pointer; 
    font-family: var(--mono);  
    font-size: .68rem;  
    letter-spacing: .06em;  
    text-transform: uppercase;  
    color: var(--ink);  
    transition: background 0.15s ease, transform 0.1s ease; 
  } 
   .filter-btn:hover { background: var(--yellow); color: #fff; } 
  .filter-btn.active { background: var(--ink); color: var(--bg); } 
   /* Hero */ 
  .hero {  
    display: block;  
    border-bottom: 3px solid var(--ink);  
    width: 100%; 
  } 
   .hero-text {  
    padding: clamp(2rem, 5vw, 3.5rem) var(--pad);  
    display: flex;  
    flex-direction: column;  
    gap: 1.2rem;  
    justify-content: center; 
    align-items: center; 
    text-align: center; 
    max-width: 1200px; 
    margin: 0 auto; 
  } 
   .hero h1 {  
    font-weight: 900;  
    font-size: clamp(2rem, 6vw, 4rem);  
    line-height: 1;  
    letter-spacing: -.03em;  
    word-break: break-word; 
    overflow-wrap: anywhere; 
    text-align: center; 
  } 
   .presentation {  
    max-width: 32rem;  
    font-size: clamp(0.95rem, 2vw, 1.15rem);  
    word-break: break-word; 
  } 
   /* Agora */ 
  .agora, .feed {  
    padding: 1.6rem var(--pad) 2.2rem;  
    max-width: 1400px; 
    margin: 0 auto; 
  } 
   
  .agora { border-bottom: 3px solid var(--ink); } 
  .section-label { margin-bottom: 1.1rem; } 
   .agora-grid {  
    display: grid;  
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));  
    border: 2px solid var(--ink);  
  } 
   .agora-item {  
    padding: 1.2rem;  
    min-height: 120px;  
    display: flex;  
    flex-direction: column;  
    justify-content: space-between;  
    overflow: hidden; 
  } 
   /* Bloco 1: Fundo Branco / Texto Preto */ 
  .agora-item:nth-child(1) {  
    background: #ffffff;  
    color: var(--ink); 
    border-bottom: 2px solid var(--ink);  
  } 
  .agora-item:nth-child(1) .mono { 
    color: rgba(22, 20, 18, 0.7);
